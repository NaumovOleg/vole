name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm ci
      - name: Tests (shared)
        run: bun test
        working-directory: shared
      - name: Tests (infra) + typecheck
        run: bun test && npx tsc --noEmit
        working-directory: infra
      - name: Tests (cli) + typecheck
        run: bun test && npx tsc --noEmit
        working-directory: cli
      - name: UI typecheck + build
        run: npx tsc --noEmit && npm run build
        working-directory: ui
      - name: CDK synth
        run: npx cdk synth --quiet
        working-directory: infra

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ADMIN_IDENTIFIERS: ${{ secrets.ADMIN_IDENTIFIERS || 'admin@vole.sh' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Install dependencies
        run: npm ci
      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap
        working-directory: infra
      - name: Deploy infrastructure
        run: npx cdk deploy --require-approval never
        working-directory: infra
      - name: Deploy UI (build -> S3 -> CloudFront invalidation)
        run: bash scripts/deploy-ui.sh